name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml
      - .github/scripts/generate_snake.py

permissions:
  contents: write

concurrency:
  group: profile-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Generate SVGs from public contributions
        run: python3 .github/scripts/generate_snake.py --username "$GITHUB_REPOSITORY_OWNER" --output-dir dist
      - name: Publish generated SVGs without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          output_ref=$(git ls-remote --heads origin refs/heads/output)
          if [ -n "$output_ref" ]; then
            git fetch origin output
            git worktree add --detach ../snake-output FETCH_HEAD
          else
            git worktree add --detach ../snake-output HEAD
            git -C ../snake-output switch --orphan output
          fi
          cp dist/github-contribution-grid-snake.svg ../snake-output/
          cp dist/github-contribution-grid-snake-dark.svg ../snake-output/
          git -C ../snake-output add github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg
          if git -C ../snake-output diff --staged --quiet; then
            exit 0
          fi
          git -C ../snake-output \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Update public contribution snake SVGs"
          output_commit=$(git -C ../snake-output rev-parse HEAD)
          git push origin "$output_commit:refs/heads/output"
